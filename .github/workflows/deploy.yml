name: Deploy to VPS

on:
  push:
    branches:
      - main          # push 到 main 時觸發,你主分支若叫別的名字要改

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd ~/bibi-bot
            git pull origin main
            docker compose up -d --build
            docker image prune -f
